[project]
name = "grype-scan-action"
version = "0.0.0"
description = "Scan SBOMs for vulnerabilities and summarise the findings"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true

[tool.basedpyright]
# The floor requires-python declares.
pythonVersion = "3.10"
pythonPlatform = "All"
# Standard mode keeps error-level type checking while avoiding the
# strict-only warnings (reportAny, reportUnknownMemberType and friends)
# that fire throughout on JSON parsed from an external tool, where the
# shape is genuinely dynamic.
typeCheckingMode = "standard"
# The directories the pre-commit hook passes as explicit targets.
# Explicit arguments override include, so this governs the runs that
# name no targets, a bare basedpyright and an editor's language
# server, which then analyse the same set the hook does.
include = ["scripts", "tests"]
